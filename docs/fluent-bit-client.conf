# Fluent Bit 真实客户端配置样例（Linux，auditd + 心跳）
#
# 用途：把本机 auditd 日志和心跳一起发到 log-fusion 服务端。
# 替换 <SERVER_IP> 为运行 FastAPI 的那台机器的局域网 IP（服务默认监听 0.0.0.0:8080）。
#
# 关键约束：
#   1. 每台客户端必须有一个**唯一且手工写死**的 client_id（下方 modify 插件注入），
#      日志与心跳用同一个值，服务端才能把日志和心跳归到同一台机器。
#   2. 心跳走独立的 [INPUT] + [OUTPUT]，只发 client_id（服务端只取这个字段）。
#   3. 日志的 http 输出会把 `log` 字段的原文交给服务端做 SHA-256 存证，不要在这里裁剪或改写内容。

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info

# --- 采集 auditd 日志 ---------------------------------------------------------
[INPUT]
    Name         tail
    Path         /var/log/audit/audit.log
    Parser       raw_line
    Tag          linux.audit
    Read_from_Head false
    DB           /var/lib/fluent-bit/audit.db

[PARSER]
    Name         raw_line
    Format       regex
    Regex        ^(?<log>.*)$

# --- 给日志打上客户端标识 -----------------------------------------------------
[FILTER]
    Name         modify
    Match        linux.audit
    Add          client_id  CHANGE_ME_CLIENT_ID
    Add          os         linux
    Add          source     ubuntu-audit
    Add          collector  fluent-bit

# --- 日志上报 ----------------------------------------------------------------
[OUTPUT]
    Name         http
    Match        linux.audit
    Host         <SERVER_IP>
    Port         8080
    URI          /api/v1/logs/linux
    Format       json
    Json_date_key timestamp
    Json_date_format iso8601
    Retry_Limit  3

# --- 心跳：每 5 秒一次，只带 client_id ----------------------------------------
[INPUT]
    Name         dummy
    Tag          heartbeat
    Dummy        {"client_id":"CHANGE_ME_CLIENT_ID"}
    Interval_Sec 5

[OUTPUT]
    Name         http
    Match        heartbeat
    Host         <SERVER_IP>
    Port         8080
    URI          /api/v1/heartbeat
    Format       json
    Retry_Limit  2

# --- Windows 客户端差异 -------------------------------------------------------
# Windows 用 winlog 输入替代 tail，并把 URI 改成 /api/v1/logs/windows：
#
# [INPUT]
#     Name           winlog
#     Channels       Security,Application,System,Setup,ForwardedEvents
#     Tag            windows.winlog
#     DB             C:\fluent-bit\winlog.db
#
# [FILTER]
#     Name           modify
#     Match          windows.winlog
#     Add            client_id  CHANGE_ME_CLIENT_ID
#     Add            os         windows
#     Add            source     winlog
#
# [OUTPUT]
#     Name           http
#     Match          windows.winlog
#     Host           <SERVER_IP>
#     Port           8080
#     URI            /api/v1/logs/windows
#     Format         json
#     Json_date_key  timestamp
#     Retry_Limit    3
